[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nevergpu"
version = "0.1.0"
description = "Sandboxed virtual GPU and portable compute device"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
